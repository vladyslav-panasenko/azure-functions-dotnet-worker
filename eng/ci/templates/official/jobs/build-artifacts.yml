jobs:

- job: BuildArtifacts
  displayName: Build artifacts

  templateContext:
    outputParentDirectory: $(Build.ArtifactStagingDirectory)
    outputs:
    - output: pipelineArtifact
      displayName: Publish nuget packages
      path: $(Build.ArtifactStagingDirectory)/NugetPackages
      artifact: NugetPackages

  pool:
    name: 1es-pool-azfunc
    image: 1es-windows-2022
    os: windows
    ${{ if eq( variables['Build.Reason'], 'Schedule' ) }}:
      demands:
      - Priority -equals Low

  variables:
    ${{ if and( not(startsWith(variables['Build.SourceBranch'], 'refs/heads/release/')),  not(startsWith(variables['Build.SourceBranch'], 'refs/tags')) ) }}:
      buildNumberTemp: $(Build.BuildNumber)
    buildNumber: $[variables.buildNumberTemp]
    pack_dir: $(Build.ArtifactStagingDirectory)/NugetPackages

  steps:
  - template: /eng/ci/templates/steps/install-dotnet.yml@self

  - task: DotNetCoreCLI@2
    displayName: Build worker solution
    inputs:
      command: custom
      custom: build
      arguments: -p:BuildNumber=$(buildNumber) -c release
      projects: |
        DotNetWorker.sln
        extensions/Worker.Extensions.Abstractions/src/Worker.Extensions.Abstractions.csproj
        extensions/Worker.Extensions.Http/src/Worker.Extensions.Http.csproj
        extensions/Worker.Extensions.Http.AspNetCore.Analyzers/src/Worker.Extensions.Http.AspNetCore.Analyzers.csproj
        extensions/Worker.Extensions.Http.AspNetCore/src/Worker.Extensions.Http.AspNetCore.csproj
        extensions/Worker.Extensions.Http.AspNetCore.Testing/src/Worker.Extensions.Http.AspNetCore.Testing.csproj

  - template: ci/sign-files.yml@eng
    parameters:
      displayName: Sign assemblies
      minimatch: true
      folderPath: ""
      pattern: |
        sdk/**/bin/**/Microsoft.Azure.Functions.Worker.Sdk*.dll
        sdk/**/bin/**/Microsoft.Azure.WebJobs.Extensions.FunctionMetadataLoader.dll
        src/**/bin/**/Microsoft.Azure.Functions.Worker*.dll
        extensions/Worker.Extensions.Abstractions/src/bin/**/Microsoft.Azure.Functions.Worker*.dll
        extensions/Worker.Extensions.Http/src/bin/**/Microsoft.Azure.Functions.Worker*.dll
        extensions/Worker.Extensions.Http.AspNetCore.Analyzers/src/bin/**/Microsoft.Azure.Functions.Worker*.dll
        extensions/Worker.Extensions.Http.AspNetCore/src/bin/**/Microsoft.Azure.Functions.Worker*.dll
        extensions/Worker.Extensions.Http.AspNetCore.Testing/src/bin/**/Microsoft.Azure.Functions.Worker*.dll
        src/**/bin/**/Azure.Functions.*.dll
      signType: dll

  - task: DeleteFiles@1
    displayName: Delete CodeSignSummary files
    inputs:
      sourceFolder: src
      contents: '**/CodeSignSummary-*.md'

  - task: DotNetCoreCLI@2
    displayName: Pack Projects
    inputs:
      command: custom
      custom: pack
      arguments: '--no-build -c release -o $(pack_dir) -p:BuildNumber=$(buildNumber)'
      projects: |
        sdk/**/Sdk*.csproj
        src/**/DotNetWorker*.csproj
        src/**/Azure.Functions.*.csproj
        extensions/Worker.Extensions.Abstractions/src/Worker.Extensions.Abstractions.csproj
        extensions/Worker.Extensions.Http/src/Worker.Extensions.Http.csproj
        extensions/Worker.Extensions.Http.AspNetCore.Analyzers/src/Worker.Extensions.Http.AspNetCore.Analyzers.csproj
        extensions/Worker.Extensions.Http.AspNetCore/src/Worker.Extensions.Http.AspNetCore.csproj
        extensions/Worker.Extensions.Http.AspNetCore.Testing/src/Worker.Extensions.Http.AspNetCore.Testing.csproj

  - template: ci/sign-files.yml@eng
    parameters:
      displayName: Sign nuget packages
      folderPath: $(pack_dir)
      minimatch: true
      pattern: |
        Microsoft.Azure.Functions.Worker*.nupkg
        Azure.Functions.*.nupkg
      signType: nuget

  - task: DeleteFiles@1
    displayName: Delete CodeSignSummary files
    inputs:
      sourceFolder: $(pack_dir)
      contents: '**/CodeSignSummary-*.md'

  - pwsh: eng/verify-testing-handoff.ps1
    displayName: Verify testing package handoff boundary

  - pwsh: eng/verify-testing-packages.ps1 -PackageDirectory $(pack_dir)
    displayName: Verify testing package installation and exact compatibility
